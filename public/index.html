    <link rel="stylesheet" href="/css/styles.css">
    <script>
        (function () {
            var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
            var slug = (location.hash.match(/from=([\w-]+)/) || [])[1];
            try {
                if (nav.type === 'reload') sessionStorage.removeItem('pf.lastProject');
                else slug = slug || sessionStorage.getItem('pf.lastProject');
            } catch (e) {}
            if (nav.type === 'reload') slug = null;
            if (location.hash) history.replaceState(null, '', location.pathname + location.search);
            if (slug) { window.PF_RETURN_TO = slug; document.documentElement.classList.add('returning'); }
        })();
    </script>
    <script src="/vendor/card-carousel.js?v=6" defer></script>
    <script src="/js/sound.js?v=6" defer></script>
    <script src="/js/home.js?v=6" defer></script>
</head>

        <div class="intro">
            <p class="who-i-am">I design and build things that make complex systems feel intuitive, tactile, and visually effortless.</p>
